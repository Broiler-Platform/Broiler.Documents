name: Office reference data

# Run once to bootstrap the pinned reference release, then only after deliberately
# changing tests/office/reference-source.json. Ordinary conformance runs reuse it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-reference-generation
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
      asset: ${{ steps.reference.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
      - id: reference
        run: python3 eng/office-reference-archive.py config

  generate:
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    container:
      image: ${{ needs.configuration.outputs.image }}
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Refuse to overwrite an existing reference release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 eng/office-reference-archive.py check-release
      - name: Configure temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build reference generator
        run: dotnet build src/tests/Broiler.Documents.Office/Broiler.Documents.Office.csproj -c Release --nologo
      - name: Generate LibreOffice text and PDF references
        env:
          OFFICE_REFERENCE_IMAGE: ${{ needs.configuration.outputs.image }}
        run: |
          bash eng/office-memory-diagnostics.sh -- \
            dotnet run --project src/tests/Broiler.Documents.Office -c Release --no-build -- \
              --extras-dir "$BROILER_OFFICE_EXTRAS_DIR" \
              --prepare-references "$RUNNER_TEMP/office-references" \
              --reference-image "$OFFICE_REFERENCE_IMAGE" \
              --font-dir "$BROILER_OFFICE_FONT_DIR" --font-set "$BROILER_OFFICE_FONT_SET" \
              --jobs 4
      - name: Package reference archive
        env:
          REFERENCE_ASSET: ${{ needs.configuration.outputs.asset }}
        run: |
          mkdir -p test-results/reference-release
          python3 eng/office-reference-archive.py package --directory "$RUNNER_TEMP/office-references" \
            --archive "$GITHUB_WORKSPACE/test-results/reference-release/$REFERENCE_ASSET"
          cp "$RUNNER_TEMP/office-references/manifest.json" test-results/office-reference-manifest.json
      - name: Publish immutable reference release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE_ASSET: ${{ needs.configuration.outputs.asset }}
        run: |
          python3 eng/office-reference-archive.py publish \
            --archive "$GITHUB_WORKSPACE/test-results/reference-release/$REFERENCE_ASSET"
      - name: Upload reference generation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-reference-generation
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
