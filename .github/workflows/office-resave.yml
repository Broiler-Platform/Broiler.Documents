name: Office re-save conformance

# Runs on the hosted .NET SDK without the Office toolchain container.
# Downloads the pinned LibreOffice sw/qa/extras corpus (or an explicit URL),
# re-saves the documents with broilerdoc, and reports normalized round-trip fidelity.
# See docs/guides/office-conformance.md for details.

on:
  schedule:
    # 03:45 UTC, after office-conformance.
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      render:
        description: Compare before/after rendered images as well as the normalized model
        type: boolean
        required: false
        default: true
      threshold:
        description: Minimum matching pixels per page, 0 to 100 percent (100 requires exact equality)
        required: false
        default: '80'
      dpi:
        description: Before/after image resolution in dots per inch
        required: false
        default: '144'
      maxPages:
        description: Maximum rendered pages per document; reaching the limit fails the image check
        required: false
        default: '40'
      incremental:
        description: 'Recheck only previously failed documents tracked in the repository'
        type: boolean
        required: false
        default: false
      only:
        description: Substring filter, or @path/to/sample-list.txt in the checkout for exact extras IDs
        required: false
        default: ''
      extrasUrl:
        description: Optional GitHub tree URL for QA extras; empty uses the pinned reference corpus revision
        required: false
        default: ''
      jobs:
        description: Concurrent documents (use 1 to reduce peak memory further)
        required: false
        default: '2'
      maxFiles:
        description: Optional cap on the number of extras sample files to evaluate
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: office-resave-${{ inputs.incremental && 'incremental' || startsWith(inputs.only, '@') && github.run_id || 'full' }}
  cancel-in-progress: false

jobs:
  resave:
    name: Office re-save
    runs-on: ubuntu-24.04

    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the pinned corpus revision
        id: corpus
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          config = json.loads(Path('tests/office/reference-source.json').read_text(encoding='utf-8'))
          revision = config.get('corpusRevision', '')
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('corpusRevision must be a full Git commit SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'revision={revision}\n')
          PY

      - name: Run the re-save conformance suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICE_RENDER: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.render && 'true' || 'false' }}
          OFFICE_THRESHOLD: ${{ inputs.threshold || '80' }}
          OFFICE_DPI: ${{ inputs.dpi || '144' }}
          OFFICE_MAX_PAGES: ${{ inputs.maxPages || '40' }}
          OFFICE_INCREMENTAL: ${{ inputs.incremental && 'true' || 'false' }}
          OFFICE_ONLY: ${{ inputs.only || '' }}
          OFFICE_EXTRAS_URL: ${{ inputs.extrasUrl || format('https://github.com/LibreOffice/core/tree/{0}/sw/qa/extras', steps.corpus.outputs.revision) }}
          OFFICE_JOBS: ${{ inputs.jobs || '2' }}
          OFFICE_MAX_FILES: ${{ inputs.maxFiles || '' }}
        run: |
          ARGS=(
            --output-dir "$GITHUB_WORKSPACE/test-results"
            --jobs "$OFFICE_JOBS"
            --resave
            --threshold "$OFFICE_THRESHOLD"
            --dpi "$OFFICE_DPI"
            --max-pages "$OFFICE_MAX_PAGES"
          )
          ARGS+=(--extras-url "$OFFICE_EXTRAS_URL")
          if [ "$OFFICE_RENDER" = "false" ]; then
            ARGS+=(--no-resave-render)
          fi
          if [ "$OFFICE_INCREMENTAL" = "true" ]; then
            ARGS+=(--incremental)
          fi
          if [ -n "$OFFICE_ONLY" ]; then
            ARGS+=(--only "$OFFICE_ONLY")
          fi
          if [ -n "$OFFICE_MAX_FILES" ]; then
            ARGS+=(--max-files "$OFFICE_MAX_FILES")
          fi
          RUNNER_STATUS=0
          bash eng/run-office-conformance.sh "${ARGS[@]}" || RUNNER_STATUS=$?
          cp tests/office/resave-failed-documents.txt test-results/resave-failed-documents.txt
          if [ "$RUNNER_STATUS" = "99" ]; then
            echo "::error::The suite could not run. Exit 99 is a defect in the harness."
            exit 1
          fi
          if [ "$RUNNER_STATUS" -gt 0 ]; then
            echo "::error::The re-save conformance suite failed (exit $RUNNER_STATUS)."
            exit 1
          fi

      - name: Create a new issue for this run
        if: always()
        uses: actions/github-script@v8
        env:
          OFFICE_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('node:fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            const status = process.env.OFFICE_JOB_STATUS;
            const path = require('node:path');
            const resultsDir = path.join(process.env.GITHUB_WORKSPACE, 'test-results');
            const reportPath = path.join(resultsDir, 'office-major-differences.md');
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'No completed re-save report was produced. See workflow logs for the harness failure.';
            // Keep room for metadata within GitHub's issue body limit.
            const details = report.length > 55000
              ? report.slice(0, 55000) + '\n\nReport truncated; download the full artifact.'
              : report;
            const issue = await github.rest.issues.create({
              ...context.repo,
              title: `Office re-save conformance: run ${context.runNumber}, attempt ${attempt} (${status})`,
              body: `Workflow run: ${runUrl} (attempt ${attempt})\nStatus: **${status}**\nCommit: ${context.sha}\nTrigger: ${context.eventName}\nIncremental: ${context.payload.inputs?.incremental || 'false'}\n\n${details}`,
            });
            core.info(`Created ${issue.data.html_url}`);
            await core.summary.addLink('Office re-save conformance issue', issue.data.html_url).addRaw('\n\n' + details).write();

      - name: Upload the re-save report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-resave
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
