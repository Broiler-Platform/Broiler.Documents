name: Office re-save conformance

# Uses the Broiler.Code office image's LibreOffice sw/qa/extras corpus,
# re-saves the documents with broilerdoc, and compares the bytes.
# See docs/guides/office-conformance.md for details.

on:
  schedule:
    # 03:45 UTC, after office-conformance.
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      incremental:
        description: 'Recheck only previously failed documents tracked in the repository'
        type: boolean
        required: false
        default: false
      only:
        description: Substring filter, or @path/to/sample-list.txt in the checkout for exact extras IDs
        required: false
        default: ''
      extrasUrl:
        description: GitHub tree URL for LibreOffice QA extras samples (e.g. sw/qa/extras or sc/qa/extras)
        required: false
        default: 'https://github.com/LibreOffice/core/tree/master/sw/qa/extras'
      jobs:
        description: Concurrent documents (use 1 to reduce peak memory further)
        required: false
        default: '2'
      maxFiles:
        description: Optional cap on the number of extras sample files to evaluate
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: office-resave-${{ (startsWith(inputs.only, '@') || (inputs.incremental && inputs.only != '')) && github.run_id || 'full' }}
  cancel-in-progress: false

jobs:
  reference-configuration:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: reference
        run: python3 eng/office-reference-archive.py config

  resave:
    name: Office re-save
    needs: reference-configuration
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.reference-configuration.outputs.image }}
      options: --init

    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Configure temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v7

      - name: Build
        run: |
          dotnet build src/tests/Broiler.Documents.Office/Broiler.Documents.Office.csproj \
            -c Release --nologo

      - name: Run the re-save conformance suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICE_INCREMENTAL: ${{ inputs.incremental && 'true' || 'false' }}
          OFFICE_ONLY: ${{ inputs.only || '' }}
          OFFICE_EXTRAS_URL: ${{ inputs.extrasUrl || 'https://github.com/LibreOffice/core/tree/master/sw/qa/extras' }}
          OFFICE_JOBS: ${{ inputs.jobs || '2' }}
          OFFICE_MAX_FILES: ${{ inputs.maxFiles || '' }}
        run: |
          ARGS=(
            --output-dir "$GITHUB_WORKSPACE/test-results"
            --skip-install
            --jobs "$OFFICE_JOBS"
            --resave
          )
          if [ "$OFFICE_EXTRAS_URL" = "$BROILER_OFFICE_EXTRAS_URL" ]; then
             ARGS+=(--extras-dir "$BROILER_OFFICE_EXTRAS_DIR")
          else
            ARGS+=(--extras-url "$OFFICE_EXTRAS_URL")
          fi
          if [ "$OFFICE_INCREMENTAL" = "true" ]; then
            ARGS+=(--incremental)
          fi
          if [ -n "$OFFICE_ONLY" ]; then
            ARGS+=(--only "$OFFICE_ONLY")
          fi
          if [ -n "$OFFICE_MAX_FILES" ]; then
            ARGS+=(--max-files "$OFFICE_MAX_FILES")
          fi
          RUNNER_STATUS=0
          bash eng/run-office-conformance.sh "${ARGS[@]}" || RUNNER_STATUS=$?
          if [ "$RUNNER_STATUS" = "99" ]; then
            echo "::error::The suite could not run. Exit 99 is a defect in the harness."
            exit 1
          fi
          if [ "$RUNNER_STATUS" -gt 0 ]; then
            echo "::error::The re-save conformance suite failed (exit $RUNNER_STATUS)."
            exit 1
          fi

      - name: Create a new issue for this run
        if: always()
        uses: actions/github-script@v8
        env:
          OFFICE_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('node:fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            const status = process.env.OFFICE_JOB_STATUS;
            const path = require('node:path');
            const resultsDir = path.join(process.env.GITHUB_WORKSPACE, 'test-results');
            const issue = await github.rest.issues.create({
              ...context.repo,
              title: `Office re-save conformance: run ${context.runNumber}, attempt ${attempt} (${status})`,
              body: `Workflow run: ${runUrl} (attempt ${attempt})\nStatus: **${status}**\nCommit: ${context.sha}\nTrigger: ${context.eventName}`,
            });
            core.info(`Created ${issue.data.html_url}`);
            await core.summary.addLink('Office re-save conformance issue', issue.data.html_url).write();
            if (status !== 'success')
              core.setFailed('Re-save conformance run failed.');

      - name: Upload the re-save report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-resave
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
