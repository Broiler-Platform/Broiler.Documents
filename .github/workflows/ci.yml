name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        description: Resolved preview version for a publish run
        type: string
        default: ''
      package-source:
        description: 'Feed a publish run restores Broiler packages from (github or nuget). Empty keeps the repository NuGet.config.'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

env:
  PACKAGE_VERSION: ${{ inputs.package-version }}
  PACKAGE_SOURCE: ${{ inputs.package-source }}
  NuGetPackageSourceCredentials_broiler-github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # A publish run restores from its destination feed only, so the packages it
      # produces can depend only on versions a consumer of that feed can restore.
      - name: Select restore feeds
        if: env.PACKAGE_SOURCE != ''
        run: |
          case "$PACKAGE_SOURCE" in
            github|nuget) cp "eng/nuget/NuGet.$PACKAGE_SOURCE.config" NuGet.config ;;
            *) echo "::error::Unknown package source '$PACKAGE_SOURCE'."; exit 1 ;;
          esac
          echo "Restoring from the $PACKAGE_SOURCE feed configuration."

      - name: Test preview version selection
        run: node --test eng/resolve-preview-version.test.mjs

      - name: Build
        run: |
          args=()
          if [ -n "$PACKAGE_VERSION" ]; then
            args+=("-p:Version=$PACKAGE_VERSION" "-p:PackageVersion=$PACKAGE_VERSION")
          fi
          dotnet build Broiler.Documents.slnx -c Release --nologo "${args[@]}"

      - name: Test
        shell: pwsh
        run: ./eng/run-tests.ps1 -Configuration Release

      # Console suites are not discovered by dotnet test.
      - name: Run the corpus suite over the command line
        timeout-minutes: 20
        run: |
          status=0
          dotnet run --project src/tests/Broiler.Documents.Corpus -c Release --no-build -- \
            --report ./test-results/corpus.json --junit ./test-results/corpus.junit.xml \
            > ./test-results/corpus.log 2>&1 || status=$?
          cat ./test-results/corpus.log
          if [ "$status" -ne 0 ] || ! grep -qE '^[1-9][0-9]*/[1-9][0-9]* passed, 0 failed\.$' ./test-results/corpus.log; then
            echo '::error::The corpus suite failed or executed no checks.'
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn

      - name: Pack and verify every package
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./eng/pack.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
