name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # Every project in this component is platform-neutral net10.0, so both
          # legs build the same twenty projects. They run anyway because the
          # codecs touch encodings, newlines, and path handling, and those are
          # exactly the places where the two hosts disagree - and because the CLI
          # renders text through whatever fonts the host happens to have, which
          # is the one place the two legs are expected to look different.
          - os: ubuntu-latest
            configuration: Release-Linux
          - os: windows-latest
            configuration: Release-Windows

    steps:
      # One level only, and by name. Broiler.Graphics supplies the value types the
      # document model is built on, Broiler.DOM the parser the HTML codec uses;
      # both are project references, so nothing restores without them.
      # Broiler.Graphics needs its own Broiler.Media in turn, which is why the
      # second step exists. `--recursive` is deliberately NOT used: Broiler.Media
      # declares Broiler.Graphics as a submodule of its own and the recursion
      # would not terminate.
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check out the graphics submodule's own dependency
        run: git -C Broiler.Graphics submodule update --init --depth 1 Broiler.Media

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Broiler.Documents.slnx -c ${{ matrix.configuration }} --nologo

      # Three PDF delivery guards read the application heads in the aggregate
      # repository and report as skipped here, which is expected; see
      # PdfGuardRoots. It was four until the detector was repaired: the fourth
      # read a CLI path that had moved into this repository, and now runs here
      # unconditionally like every other guard over this component's own source.
      - name: Test
        run: |
          dotnet test Broiler.Documents.slnx -c ${{ matrix.configuration }} --no-build --nologo             --logger "trx;LogFilePrefix=broiler" --results-directory ./test-results

      # A `dotnet test` that discovers nothing exits 0, so a build that silently
      # stopped producing test assemblies would pass this job in green. The guard
      # is a floor on the executed count rather than an exact number: it catches a
      # collapse without failing every time somebody adds a test (PDF roadmap
      # §6.6).
      - name: Guard against a collapsed test count
        run: |
          # awk rather than bc: bc is not on the Windows runner's git-bash, and a
          # guard that only works on one leg guards one leg.
          total=$(grep -ho 'total="[0-9]*"' ./test-results/*.trx             | grep -o '[0-9]*' | awk '{ sum += $1 } END { print sum + 0 }')
          echo "Executed $total test(s)."
          if [ "$total" -lt 1400 ]; then
            echo "::error::Executed test count collapsed to ${total:-0}; expected at least 1400."
            exit 1
          fi

      # The console-runner suites in Graphics and Media, which `dotnet test`
      # cannot see: they are Exe projects with their own runners, so a solution
      # test pass reports nothing for them and reports success while doing it.
      # They are run explicitly, against this repository's own submodule pins.
      - name: Test the Graphics and Media suites this component pins
        run: |
          set -e
          for project in             Broiler.Graphics/src/tests/Broiler.Graphics.Tests/Broiler.Graphics.Tests.csproj             Broiler.Graphics/Broiler.Media/src/tests/Broiler.Media.Image.Tests/Broiler.Media.Image.Tests.csproj             Broiler.Graphics/Broiler.Media/src/tests/Broiler.Media.Image.Managed.Tests/Broiler.Media.Image.Managed.Tests.csproj
          do
            echo "--- $project"
            output=$(dotnet run --project "$project" -c ${{ matrix.configuration }} --nologo)
            echo "$output" | tail -3
            echo "$output" | grep -qE '^[0-9]+/[0-9]+ passed, 0 failed\.$' || {
              echo "::error::$project did not report a clean run."
              exit 1
            }
            echo "$output" | grep -qE '^0/0 passed' && {
              echo "::error::$project executed no tests."
              exit 1
            }
          done

      # Proves the eight packages still build from this commit. Every project is
      # platform-neutral, so one host covers the whole set and one configuration
      # produces it. Broiler.Documents.Pdf and Broiler.Documents.Cli are both
      # IsPackable=false and are absent by design. Publishing is a separate,
      # deliberate action - see publish.yml.
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack Broiler.Documents.slnx -c Release --nologo -o ./artifacts
          echo "Packed:"
          ls -1 ./artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
