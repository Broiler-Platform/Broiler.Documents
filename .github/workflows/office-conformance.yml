name: Office conformance

# Uses the Broiler.Code office image's LibreOffice sw/qa/extras corpus,
# compares broilerdoc with the pinned, pre-generated LibreOffice text/PDF outputs,
# and creates a new GitHub issue for every run with the top x major differences
# (default x = 3). See docs/guides/office-conformance.md for details.
#
# Nightly and dispatchable rather than a pull-request check, for four reasons in
# descending order of weight.
#
# It depends on a third-party binary whose layout changes between releases. A
# per-PR check running against whatever LibreOffice the runner image happens to
# ship would fail on days when nobody changed anything, because a font package
# update moves every band at once. Pinning the version is the only coherent
# answer, and pinning it makes the check heavy.
#
# It pulls a large office toolchain and corpus container image, against
# a suite whose value is regression detection over weeks rather than per commit.
#
# The sibling repository's two WPT workflows are dispatch-only for the same
# reason, and nightly-fuzz.yml in this repository states the policy outright:
# "Not a required check, and it must not become one."
#
# And the tool register gates it. tests/office/tools/manifest.json holds
# LibreOffice and poppler, both approved by the project reviewer on 2026-09-06,
# under the rule this component already operates: a tool absent from the register
# may not run in CI. --allow-pending-tools is not passed here and must not be
# added - the flag exists for a developer's machine, and adding it would let a
# future row that has not been reviewed run here without anyone noticing, which
# is the one thing the register exists to stop.
#
# What does run on every pull request, at no cost, is the guard tests in
# Broiler.Documents.Tests: the schemas parse, no tool is approved merely by being
# written down, no baseline row is classified merely by being written down, every
# documented row cites a file that exists, and no document of a supported format
# is committed. Those catch every control-file mistake without installing
# anything.

on:
  schedule:
    # 03:15 UTC, after nightly-fuzz and off the hour.
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      axis:
        description: 'semantic, pixel, or all'
        required: false
        default: 'all'
      only:
        description: Substring filter, or @path/to/sample-list.txt in the checkout for exact extras IDs
        required: false
        default: ''
      dpi:
        description: Resolution for both rasterisers
        required: false
        default: '144'
      threshold:
        description: Minimum rendering similarity percentage (0 to 100)
        required: false
        default: '80'
      extrasUrl:
        description: GitHub tree URL for LibreOffice sw/qa/extras samples
        required: false
        default: 'https://github.com/LibreOffice/core/tree/master/sw/qa/extras'
      topDifferences:
        description: Number of major differences to report in the GitHub issue (default 3)
        required: false
        default: '3'
      jobs:
        description: Concurrent documents (use 1 to reduce peak memory further)
        required: false
        default: '2'
      maxFiles:
        description: Optional cap on the number of extras sample files to evaluate
        required: false
        default: ''
      seedCorpus:
        description: Run the authored seed corpus instead of sw/qa/extras
        type: boolean
        required: false
        default: false
      updateBaseline:
        description: >
          Regenerate tests/office/office-baseline.json from this run and upload it
          as an artifact. It is never committed by CI - a row is classified by a
          person, not by a workflow.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: office-conformance-${{ startsWith(inputs.only, '@') && github.run_id || 'full' }}
  cancel-in-progress: false

jobs:
  reference-configuration:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: reference
        run: python3 eng/office-reference-archive.py config

  conformance:
    name: Office conformance
    needs: reference-configuration
    # The same release as office-reference-data.yml, never ubuntu-latest. The
    # LibreOffice and Poppler that run here come from the digest-pinned office
    # image, which is ubuntu:24.04 too, so the VM only hosts it.
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.reference-configuration.outputs.image }}
      # LibreOffice spawns helpers that can outlive their parent. Reap them
      # instead of accumulating zombies under GitHub's tail entrypoint.
      options: --init

    # Linux only, and that is a limitation rather than a preference. On Windows
    # LibreOffice enumerates the system font store and there is no lever to
    # restrict it, so the two sides cannot be made to draw with the same faces
    # and a pixel comparison would measure the machine. The semantic axis runs
    # fine on Windows and a developer can run it there; it is not worth a second
    # CI leg while the interesting half cannot follow it.
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      # Use the runner's disk-backed temporary directory for .NET and child tools.
      - name: Configure temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v7

      - name: Download pinned LibreOffice references
        if: ${{ !inputs.seedCorpus && !inputs.updateBaseline && (inputs.extrasUrl == '' || inputs.extrasUrl == 'https://github.com/LibreOffice/core/tree/master/sw/qa/extras') }}
        run: |
          python3 eng/office-reference-archive.py download --directory "$RUNNER_TEMP/office-references"
          mkdir -p test-results
          cp tests/office/reference-source.json test-results/office-reference-source.json
          cp "$RUNNER_TEMP/office-references/manifest.json" test-results/office-reference-manifest.json

      - name: Build
        run: |
          dotnet build src/tests/Broiler.Documents.Office/Broiler.Documents.Office.csproj \
            -c Release --nologo

      # Inputs reach the script through the environment rather than through
      # string interpolation. On the schedule trigger the inputs context is
      # empty, so every one needs a fallback; and interpolating a user-supplied
      # string straight into a shell line lets whoever dispatches the workflow
      # write the rest of the command. Quoted environment variables do neither.
      - name: Run the office conformance suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICE_AXIS: ${{ inputs.axis || 'all' }}
          OFFICE_THRESHOLD: ${{ inputs.threshold || '80' }}
          OFFICE_DPI: ${{ inputs.dpi || '144' }}
          OFFICE_ONLY: ${{ inputs.only || '' }}
          OFFICE_EXTRAS_URL: ${{ inputs.extrasUrl || 'https://github.com/LibreOffice/core/tree/master/sw/qa/extras' }}
          OFFICE_TOP_DIFFERENCES: ${{ inputs.topDifferences || '3' }}
          OFFICE_MAX_FILES: ${{ inputs.maxFiles || '' }}
          OFFICE_JOBS: ${{ inputs.jobs || '2' }}
          OFFICE_SEED_CORPUS: ${{ inputs.seedCorpus && 'true' || 'false' }}
          OFFICE_UPDATE_BASELINE: ${{ inputs.updateBaseline || 'false' }}
        run: |
          # Deliberately not `set -e`. The runner exits with its failure count,
          # so aborting here would kill the step before the output is printed
          # and a failing run would arrive with no failures in it.
          REFERENCE_FONTS="$BROILER_OFFICE_FONT_DIR"
          REFERENCE_FONT_SET="$BROILER_OFFICE_FONT_SET"
          if [ "$OFFICE_EXTRAS_URL" = "$BROILER_OFFICE_EXTRAS_URL" ] && \
             [ "$OFFICE_SEED_CORPUS" != "true" ] && [ "$OFFICE_UPDATE_BASELINE" != "true" ]; then
            # The fonts and their set name both come from the archive, so a new
            # reference font set needs no new office image.
            REFERENCE_FONTS="$RUNNER_TEMP/office-references/fonts/0"
            REFERENCE_FONT_SET="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["Environment"]["FontSet"] or "")' \
              "$RUNNER_TEMP/office-references/manifest.json")"
          fi
          ARGS=(
            --output-dir "$GITHUB_WORKSPACE/test-results"
            --skip-install
            --jobs "$OFFICE_JOBS"
            --axis "$OFFICE_AXIS"
            --dpi "$OFFICE_DPI"
            --threshold "$OFFICE_THRESHOLD"
            --font-dir "$REFERENCE_FONTS"
            --font-set "$REFERENCE_FONT_SET"
            --top-differences "$OFFICE_TOP_DIFFERENCES"
          )
          # Cached runs use the VM-generated corpus/font snapshot; the container
          # supplies only the runtime and rasterizer for those comparisons.
          if [ "$OFFICE_EXTRAS_URL" = "$BROILER_OFFICE_EXTRAS_URL" ]; then
            if [ "$OFFICE_SEED_CORPUS" != "true" ] && [ "$OFFICE_UPDATE_BASELINE" != "true" ]; then
              ARGS+=(--extras-dir "$RUNNER_TEMP/office-references/inputs" --references-dir "$RUNNER_TEMP/office-references")
            else
              ARGS+=(--extras-dir "$BROILER_OFFICE_EXTRAS_DIR")
            fi
          else
            ARGS+=(--extras-url "$OFFICE_EXTRAS_URL")
          fi
          if [ -n "$OFFICE_ONLY" ]; then
            ARGS+=(--only "$OFFICE_ONLY")
          fi
          if [ -n "$OFFICE_MAX_FILES" ]; then
            ARGS+=(--max-files "$OFFICE_MAX_FILES")
          fi
          if [ "$OFFICE_SEED_CORPUS" = "true" ]; then
            ARGS+=(--seed-corpus)
          fi
          if [ "$OFFICE_UPDATE_BASELINE" = "true" ]; then
            ARGS+=(--update-baseline --restamp)
          fi
          RUNNER_STATUS=0
          bash eng/run-office-conformance.sh "${ARGS[@]}" || RUNNER_STATUS=$?
          if [ -f ./test-results/triage/triage.md ]; then
            cat ./test-results/triage/triage.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$RUNNER_STATUS" = "69" ]; then
            echo "::warning::The toolchain could not be provisioned; nothing was measured."
            cat ./test-results/office-toolchain-failure.json || true
            exit 1
          fi
          if [ "$RUNNER_STATUS" = "99" ]; then
            echo "::error::The suite could not run. Exit 99 is a defect in the harness."
            exit 1
          fi
          # Only 0..98 are conformance verdicts. Signals/native crashes and
          # missing final results must fail here, before issue publication.
          if [ "$RUNNER_STATUS" -gt 99 ]; then
            echo "::error::The office harness terminated abnormally (exit $RUNNER_STATUS)."
            exit 1
          fi
          if [ ! -s ./test-results/office-results.json ]; then
            echo "::error::The office harness did not produce final results; any checkpoint is incomplete."
            exit 1
          fi
          if [ "$OFFICE_SEED_CORPUS" = "true" ]; then
            # Both greps, for the reason ci.yml gives: the first says nothing
            # failed, the second says something actually ran. A suite that
            # materialised nothing would otherwise print a clean line over an
            # empty run.
            if ! grep -qE '^[0-9]+/[0-9]+ passed, 0 failed\.$' ./test-results/office-results.log; then
              echo "::error::The office conformance suite did not report a clean run."
              exit 1
            fi
          fi
          if grep -qE '^0/0 passed' ./test-results/office-results.log; then
            echo "::error::The suite executed no checks. Either a tool could not be driven or the corpus is empty; the log names which."
            exit 1
          fi

      # Publish independently of the harness, including clean runs, focused
      # replays, seed/baseline runs and failures before a report was produced.
      - name: Create a new issue for this run
        if: always()
        uses: actions/github-script@v8
        env:
          OFFICE_JOB_STATUS: ${{ job.status }}
          OFFICE_REPORT_EXPECTED: ${{ !inputs.seedCorpus && !inputs.updateBaseline }}
        with:
          script: |
            const fs = require('node:fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            const status = process.env.OFFICE_JOB_STATUS;
            const path = require('node:path');
            const resultsDir = path.join(process.env.GITHUB_WORKSPACE, 'test-results');
            const reportPath = path.join(resultsDir, 'office-major-differences.md');
            const finalResultsPath = path.join(resultsDir, 'office-results.json');
            const partialResultsPath = path.join(resultsDir, 'office-partial-results.json');
            const partial = !fs.existsSync(finalResultsPath) && fs.existsSync(partialResultsPath);
            const resultsPath = partial ? partialResultsPath : finalResultsPath;
            let results;
            try {
              results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              for (const key of ['passed', 'failed', 'skipped']) {
                if (!Number.isSafeInteger(results[key]) || results[key] < 0)
                  throw new Error(`Invalid ${key} count`);
              }
            } catch (error) {
              core.warning(`No valid conformance results: ${error.message}`);
              results = null;
            }
            const missingReport = process.env.OFFICE_REPORT_EXPECTED === 'true' && !fs.existsSync(reportPath);
            const verdict = !results || missingReport || partial ? 'results incomplete'
              : results.failed > 0 ? `${results.failed} failed checks`
              : results.passed === 0 ? 'no checks executed' : 'no failed checks';
            const counts = results
              ? `Checks: **${results.passed} passed, ${results.failed} failed, ${results.skipped} skipped**.`
              : '**No valid check counts available; conformance has not been established.**';
            const partialReportPath = path.join(resultsDir, 'office-partial-differences.md');
            const selectedReport = !partial && fs.existsSync(reportPath) ? reportPath : partialReportPath;
            const report = fs.existsSync(selectedReport)
              ? fs.readFileSync(selectedReport, 'utf8')
              : 'No major-differences report was produced. See the run logs and uploaded artifacts for results or setup failures.';
            const metadata = [
              `Workflow run: ${runUrl} (attempt ${attempt})`,
              `Conformance result: **${verdict}**`,
              counts,
              ...(partial ? [`**Partial results: ${results?.completedSamples ?? '?'} / ${results?.totalSamples ?? '?'} documents completed.**`] : []),
              `Status before issue publication: **${status}**`,
              `Commit: ${context.sha}`,
              `Trigger: ${context.eventName}`,
              ...(fs.existsSync(path.join(resultsDir, 'office-reference-source.json'))
                ? [`Reference set: ${JSON.parse(fs.readFileSync(path.join(resultsDir, 'office-reference-source.json'), 'utf8')).releaseTag}`]
                : []),
            ].join('\n');
            // Stay within GitHub's issue body limit, including large reports.
            const body = `${metadata}\n\n${report}`;
            const limit = 60000;
            const suffix = '\n\nReport truncated; the full report is available in the workflow artifacts.';
            const issue = await github.rest.issues.create({
              ...context.repo,
              title: `Office conformance: run ${context.runNumber}, attempt ${attempt} (${verdict})`,
              body: body.length > limit ? body.slice(0, limit - suffix.length) + suffix : body,
            });
            core.info(`Created ${issue.data.html_url}`);
            await core.summary.addLink('Office conformance issue', issue.data.html_url).write();
            if (!results || missingReport || partial || results.passed + results.failed === 0)
              core.setFailed('Conformance results are missing, incomplete or contain no executed checks. See the issue and run logs.');

      # The dispatch input offers a regenerated baseline, so it has to arrive
      # somewhere a person can fetch it. It is deliberately not committed: a row
      # is classified by a reviewer, and a workflow that pushed one would be
      # writing the reviewer's half of the file.
      - name: Collect the regenerated baseline
        if: ${{ always() && inputs.updateBaseline == true }}
        run: cp tests/office/office-baseline.json ./test-results/office-baseline.regenerated.json || true

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-conformance
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
